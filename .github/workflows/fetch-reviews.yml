name: Fetch Google Reviews

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: google-reviews-sync
  cancel-in-progress: false

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Test review sync
        run: npm test

      # Step 4: Run the script to fetch reviews
      - name: Fetch Google Reviews
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          LOCATION_ID: ${{ secrets.LOCATION_ID }}
          FOURTH_ST_LOCATION_ID: ${{ secrets.FOURTH_ST_LOCATION_ID }}
          SOUTH_CREEK_LOCATION_ID: ${{ secrets.SOUTH_CREEK_LOCATION_ID }}
        run: node fetch-reviews.js

      # Step 5: Commit and push changes
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "Update Google Reviews [skip ci]" || echo "No changes to commit"
          git push
